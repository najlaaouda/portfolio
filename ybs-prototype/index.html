<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: presentation stage — phone centred on a dark stage, flow index on the left (drawer on phones) */
:root{
  --stage:#141113;        /* warm near-black, biased to the brand red */
  --panel:#1d1a1c;
  --line:#2e292c;
  --ink:#f3eeee;
  --muted:#9a8f92;
  --brand:#e3161b;        /* YBS red */
  --brand-deep:#9b1c0c;
  --hot:rgba(227,22,27,.28);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:260px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 14px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.brand b{font-weight:600;font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.flows{overflow-y:auto;padding:8px 0 24px;flex:1}
.flows h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:16px 20px 6px}
.flows button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 20px;font-size:13px;color:#d8d0d2;cursor:pointer}
.flows button:hover{background:#262124}
.flows button.on{color:#fff;background:#2a2023;box-shadow:inset 3px 0 0 var(--brand)}
.flows button i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:18px}

.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.toolbar{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:8px;justify-content:space-between;align-items:center;z-index:5}
.toolbar .grp{display:flex;gap:8px;align-items:center}
.tb{background:#231f21;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tb:hover{border-color:#4a3f43}
.tb[aria-pressed="true"]{border-color:var(--brand);color:#fff}
.tb:focus-visible,.flows button:focus-visible,.hs:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:500}
.menuBtn{display:none}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.hint kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:#cfc6c8}

/* device */
.device{position:relative;width:395px;height:832px;border-radius:56px;background:#0b0a0b;padding:10px;box-shadow:0 0 0 1px #3a3336,0 30px 80px rgba(0,0,0,.55);transform-origin:0 0;position:absolute;top:0;left:0}
.devwrap{position:relative;flex:none}
.viewport{position:relative;width:375px;height:812px;border-radius:46px;overflow:hidden;background:#fafafa;isolation:isolate}
.screen{position:absolute;inset:0;overflow:hidden;background:#fafafa;will-change:transform}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.canvas{position:relative;width:375px}
.canvas img{display:block;width:375px;max-width:none;user-select:none;-webkit-user-drag:none}
.fixed{position:absolute;left:0;right:0;z-index:3}
.hs{position:absolute;cursor:pointer;border-radius:10px;background:transparent;border:0;padding:0;transition:background .25s}
.show-hs .hs,.flash .hs{background:var(--hot);box-shadow:inset 0 0 0 1.5px rgba(227,22,27,.7)}
.flash .hs{animation:fl .7s ease}
@keyframes fl{0%,100%{background:transparent;box-shadow:none}30%{background:var(--hot);box-shadow:inset 0 0 0 1.5px rgba(227,22,27,.7)}}

/* toggles drawn over the design's own switches */
.tg{position:absolute;border-radius:999px;background:#e4e4e4;cursor:pointer;border:0;padding:0;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.tg.on{background:linear-gradient(110deg,var(--brand),var(--brand-deep))}
.tg.on::after{transform:translateX(var(--d))}

/* PIN + reveal overlays */
.pin-dot{position:absolute;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;pointer-events:none}
.pin-dot.f::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.key{position:absolute;width:66px;height:66px;border-radius:50%;cursor:pointer;border:0;background:transparent;transition:background .15s}
.key:active{background:rgba(227,22,27,.18)}
.reveal{position:absolute;background:#fff;font:400 15px/1 var(--font);color:#444;letter-spacing:2px;padding:2px 0;pointer-events:none}
.cover{position:absolute;pointer-events:none}

.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:rgba(30,26,28,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:all .3s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:30;transform:translateX(-105%);transition:transform .3s;min-width:240px}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .menuBtn{display:flex}
  .hint{display:none}
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){.screen{transition:none!important}.tg::after{transition:none}}
</style>

function el(tag,cls,css){const e=document.createElement(tag);if(cls)e.className=cls;if(css)Object.assign(e.style,css);return e}
function px(a){return{left:a[0]+'px',top:a[1]+'px',width:a[2]+'px',height:a[3]+'px'}}

function hotspot(parent,h){
  const b=el('button','hs',px(h));b.setAttribute('aria-label',label(h[4]));
  b.addEventListener('click',e=>{e.stopPropagation();act(h[4],h[5])});parent.appendChild(b);

function label(t){return t.startsWith('toast:')?t.slice(6):(SCREENS[t.replace('tab:','')]?.n||t)}

function build(id){

  if(d.custom==='profile') return buildProfile(scr);

  const im=el('img');im.src='screens/'+d.img+'.png';im.alt=d.n;im.draggable=false;cv.appendChild(im);
  (d.covers||[]).forEach(c=>cv.appendChild(el('div','cover',{...px(c),background:c[4]})));
  (d.toggles||[]).forEach(t=>toggle(cv,t));
  (d.reveal||[]).forEach(r=>{
    const out=el('div','reveal',px(r[2]));out.hidden=true;out.textContent=r[3];cv.appendChild(out);
    const b=el('button','hs',px(r));b.setAttribute('aria-label','Show code');
    b.onclick=e=>{e.stopPropagation();out.hidden=!out.hidden};cv.appendChild(b);
  });
  if(d.pin) buildPin(cv,d.pin);
  (d.hs||[]).forEach(hh=>{
    // nav bar + back hotspots stay put on scrolling screens
    hotspot(cv,hh);
  });
  sc.appendChild(cv);scr.appendChild(sc);
  if(d.swipe) swipe(scr,d.swipe);
  return scr;
}
function toggle(parent,t){

  b.setAttribute('role','switch');b.setAttribute('aria-checked',!!t[4]);
  b.onclick=e=>{e.stopPropagation();b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))};
  parent.appendChild(b);
}

}

function swipe(scr,[prev,next]){
  let x0=null;
  scr.addEventListener('pointerdown',e=>{x0=e.clientX});
  scr.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;
    if(dx<-50&&next)go(next,'push');else if(dx>50&&prev)go(prev,'pop')});
}

// ---------- navigation ----------
function act(t,tr){
  if(t.startsWith('toast:'))return toast(t.slice(6));
  if(t.startsWith('tab:')){let id=t.slice(4);if(id==='home')id=S.home;return reset(id,'none')}
  switch(t){
    case 'back':return back();
    case 'back-none':return back('none');
    case 'go-login':S.flow='login';return go('login');
    case 'go-signup':S.flow='signup';return go('signup');
    case 'go-reset':S.flow='reset';return go('otp');
    case 'otp-next':return go('newpass');
    case 'newpass-next':if(S.flow==='reset'){toast('Password changed. Log in with your new password');return reset('login','pop')}return go('biometric');
    case 'enter-home':S.home='8-1555';return reset(S.home);
    case 'enter-new':S.home='185-4093';return reset(S.home);
    case 'scan-done':stack.pop();return go('94-6706','fade',true);
    case 'pass-updated':toast('Password updated');return back();
    case 'pin-done':S.home='18-822';toast('Your virtual card is active');return reset('18-822');
    case 'logout':return reset('onb1');
  }
  go(t,tr||'push');
}
function reset(id,tr='fade'){stack=[];go(id,tr,true)}
function go(id,tr='push',noPush){
  if(!SCREENS[id]||busy)return;
  if(cur&&!noPush)stack.push({id:cur,tr});
  show(id,tr);
}
function back(tr){
  if(!stack.length)return;
  const p=stack.pop();show(p.id,tr||({push:'pop',up:'down',fade:'fade',none:'none'}[p.tr]||'pop'));
}
const TR={push:['translateX(100%)','translateX(-28%)'],pop:['translateX(-28%)','translateX(100%)'],up:['translateY(100%)','none'],down:['none','translateY(100%)'],fade:['opacity','opacity'],none:null};
function show(id,tr){
  clearTimeout(autoT);
  const old=vp.querySelector('.screen'),nw=build(id);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  vp.insertBefore(nw,document.getElementById('toast'));
  cur=id;sync();
  if(!old){}else if(reduce||!TR[tr]){old.remove()}
  else{
    busy=true;const dur=320,ease='cubic-bezier(.32,.72,0,1)';
    if(tr==='fade'){nw.style.opacity=0;nw.animate([{opacity:0},{opacity:1}],{duration:260,fill:'forwards'}).onfinish=()=>{nw.style.opacity=1;old.remove();busy=false}}
    else{
      const [a,b]=TR[tr];
      if(tr==='pop'||tr==='down'){old.style.zIndex=2}
      if(a!=='none')nw.animate([{transform:a},{transform:'none'}],{duration:dur,easing:ease});
      const oa=old.animate([{transform:'none'},{transform:b==='none'?'none':b}],{duration:dur,easing:ease,fill:'forwards'});
      if(tr==='up')old.animate([{filter:'brightness(1)'},{filter:'brightness(.75)'}],{duration:dur,fill:'forwards'});
      oa.onfinish=()=>{old.remove();busy=false};
    }
  }
  const d=SCREENS[id];
  if(d.auto)autoT=setTimeout(()=>{if(cur!==id)return;const a=d.auto[0];if(SCREENS[a]){stack=stack.slice(0);go(a,d.auto[2],true)}else act(a)},d.auto[1]);
  try{history.replaceState(null,'','#'+id.replace(/[^\w.~-]/g,''))}catch(e){}
}

// ---------- chrome ----------
const flows=document.getElementById('flows');let count=0;
GROUPS.forEach(([g,ids])=>{
  const h=el('h3');h.textContent=g;flows.appendChild(h);
  ids.forEach(id=>{count++;const b=el('button');b.dataset.id=id;b.innerHTML=`<i>${String(count).padStart(2,'0')}</i><span></span>`;b.querySelector('span').textContent=SCREENS[id].n;
    b.onclick=()=>{reset(id);document.getElementById('side').classList.remove('open')};flows.appendChild(b)});
});
function sync(){
  flows.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===cur));
  const on=flows.querySelector('button.on');on&&on.scrollIntoView({block:'nearest'});
  const g=GROUPS.find(x=>x[1].includes(cur));
  document.getElementById('crumb').innerHTML=`${g?g[0]:''} / <b></b>`;document.querySelector('#crumb b').textContent=SCREENS[cur].n;
  document.getElementById('backBtn').disabled=!stack.length;document.getElementById('backBtn').style.opacity=stack.length?1:.4;
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}

vp.addEventListener('click',()=>{if(vp.classList.contains('show-hs'))return;vp.classList.remove('flash');void vp.offsetWidth;vp.classList.add('flash')});

const hsBtn=document.getElementById('hsBtn');

hsBtn.onclick=()=>setHS(!vp.classList.contains('show-hs'));
document.getElementById('backBtn').onclick=()=>back();
document.getElementById('restartBtn').onclick=()=>{S.home='8-1555';reset('splash1')};
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='Backspace'||e.key==='ArrowLeft'&&e.altKey){e.preventDefault();back()}
  else if(e.key==='h'||e.key==='H')setHS(!vp.classList.contains('show-hs'));
  else if(e.key==='r'||e.key==='R')document.getElementById('restartBtn').click();
});

function fit(){const top=innerWidth>820?120:72;const w=stage.clientWidth-24,h=stage.clientHeight-top;const s=Math.max(.3,Math.min(1.05,w/395,h/832));
  dev.style.transform=`scale(${s})`;wrap.style.width=395*s+'px';wrap.style.height=832*s+'px';wrap.style.marginTop=(innerWidth>820?0:48)+'px'}
